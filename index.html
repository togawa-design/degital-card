<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小川卓也 | オービット合同会社</title>
  <meta property="og:title" content="小川卓也 | オービット合同会社" />
  <meta property="og:description" content="中小企業の経営に伴走する右腕。AI導入支援・業務効率化・COO代行をワンストップで。" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #0a0a0f;
      color: #f0f0f0;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    /* AI particle animation */
    .orbit-visual {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto 32px;
    }

    .orbit-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid transparent;
      border-top-color: #6366f1;
      animation: spin 3s linear infinite;
    }

    .orbit-ring:nth-child(2) {
      inset: 12px;
      border-top-color: #8b5cf6;
      animation-duration: 2s;
      animation-direction: reverse;
    }

    .orbit-ring:nth-child(3) {
      inset: 24px;
      border-top-color: #a78bfa;
      animation-duration: 1.5s;
    }

    .orbit-center {
      position: absolute;
      inset: 36px;
      background: radial-gradient(circle, #6366f1, #4f46e5);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 0 24px rgba(99, 102, 241, 0.5);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .name-ja {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .name-en {
      font-size: 13px;
      color: #888;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: linear-gradient(90deg, #6366f1, #8b5cf6);
      margin: 0 auto 20px;
      border-radius: 2px;
    }

    .company {
      font-size: 14px;
      color: #a78bfa;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    .tagline {
      font-size: 13px;
      color: #666;
      line-height: 1.6;
      margin-bottom: 32px;
      padding: 0 8px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 32px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 18px;
      background: #111118;
      border: 1px solid #222230;
      border-radius: 12px;
      text-decoration: none;
      color: #f0f0f0;
      font-size: 14px;
      transition: all 0.2s;
    }

    .link-btn:hover {
      border-color: #6366f1;
      background: #16161f;
      transform: translateY(-1px);
    }

    .link-btn .icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .link-btn .label {
      text-align: left;
    }

    .link-btn .label-main {
      font-size: 13px;
      font-weight: 600;
    }

    .link-btn .label-sub {
      font-size: 11px;
      color: #555;
      margin-top: 1px;
    }

    .icon-web { background: #1e1e2e; }
    .icon-mail { background: #1a1e2e; }
    .icon-fb { background: #1a1e2e; }

    .ai-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #555;
      padding: 6px 12px;
      border: 1px solid #1e1e2e;
      border-radius: 20px;
    }

    .ai-dot {
      width: 6px;
      height: 6px;
      background: #6366f1;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="orbit-visual">
      <div class="orbit-ring"></div>
      <div class="orbit-ring"></div>
      <div class="orbit-ring"></div>
      <div class="orbit-center">🪐</div>
    </div>

    <div class="name-ja">小川 卓也</div>
    <div class="name-en">Takuya Ogawa</div>

    <div class="divider"></div>

    <div class="company">オービット合同会社</div>
    <div class="tagline">
      中小企業の経営に伴走する右腕。<br>
      AI導入支援・業務効率化・COO代行を<br>ワンストップで。
    </div>

    <div class="links">
      <a class="link-btn" href="https://www.obt-llc.com/" target="_blank" rel="noopener">
        <div class="icon icon-web">🌐</div>
        <div class="label">
          <div class="label-main">obt-llc.com</div>
          <div class="label-sub">会社サイト</div>
        </div>
      </a>
      <a class="link-btn" href="mailto:t.ogawa@obt-llc.com">
        <div class="icon icon-mail">✉️</div>
        <div class="label">
          <div class="label-main">t.ogawa@obt-llc.com</div>
          <div class="label-sub">メール</div>
        </div>
      </a>
      <a class="link-btn" href="https://www.facebook.com/takuya.ogawa.94" target="_blank" rel="noopener">
        <div class="icon icon-fb">👤</div>
        <div class="label">
          <div class="label-main">Facebook</div>
          <div class="label-sub">友達申請お気軽に</div>
        </div>
      </a>
    </div>

    <div class="ai-badge">
      <div class="ai-dot"></div>
      Powered by AI
    </div>
  </div>
</body>
</html>
